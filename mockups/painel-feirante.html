<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Painel do Feirante — GiroCerto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* item 41 (25/08/2026): primeira tela construída com a identidade
  visual oficial do GiroCerto (herdada de FeiraApp.jsx — ink/paper/
  marigold/sage/leaf, Fraunces+Inter+Space Mono), pedido explícito do
  usuário depois de ver o mockup ilustrativo em Downloads/. Vermelho
  mantido como EXCEÇÃO fora da paleta pra erro/alerta (decisão do
  usuário: sinalização de risco não deveria se misturar com a marca).
  Unificação visual nas outras telas (painel-loja/app-entregador/
  painel-admin) fica pra depois — essa é a primeira, escolhida pelo
  usuário por nascer correta sem retrabalho. */
  :root{
    --ink:#223526; --paper:#EDE7D9; --marigold:#D9A62E; --sage:#7C8B6F; --leaf:#3B5B3F;
    --card:#FFFDF8; --border:rgba(34,53,38,0.08); --gray:#7C8B6F;
    --error:#B84343; --error-soft:#FBEAEA;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Fraunces',serif;margin:0;}

  /* ---------- LOGIN GATE ---------- */
  #loginGate{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);}
  .login-card{background:var(--paper);border-radius:20px;padding:36px 32px;width:360px;max-width:90vw;box-shadow:0 40px 80px -20px rgba(0,0,0,.5);}
  .login-card .marca{display:flex;align-items:center;gap:8px;margin-bottom:20px;}
  .login-card .marca-icone{width:24px;height:24px;flex-shrink:0;}
  .login-card .marca-texto{font-family:'Fraunces',serif;font-weight:700;font-size:16px;}
  .login-card .marca-texto span{color:var(--marigold);}
  .login-card h2{margin:0 0 4px;font-size:21px;}
  .login-card p{color:var(--sage);font-size:13.5px;margin:0 0 22px;}
  .login-card input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14.5px;margin-bottom:12px;font-family:'Inter',sans-serif;background:#fff;}
  .login-card input:focus{outline:none;border-color:var(--marigold);}
  .login-card button{width:100%;padding:14px;border:none;border-radius:100px;background:var(--marigold);color:var(--ink);font-weight:700;font-size:14.5px;cursor:pointer;box-shadow:0 8px 20px -6px rgba(217,166,46,.5);}
  .login-msg{font-size:13px;color:var(--error);margin-bottom:10px;min-height:16px;}

  /* ---------- APP ---------- */
  #app{display:none;}
  .topo{background:var(--leaf);padding:16px 22px 26px;position:relative;overflow:hidden;}
  .topo::after{content:'';position:absolute;right:-30px;bottom:-60px;width:170px;height:170px;border-radius:50%;background:rgba(217,166,46,.12);}
  .marca{display:flex;align-items:center;gap:7px;margin-bottom:18px;position:relative;z-index:2;}
  .marca-icone{width:20px;height:20px;flex-shrink:0;}
  .marca-texto{font-family:'Fraunces',serif;font-weight:700;font-size:13px;color:var(--paper);}
  .marca-texto span{color:var(--marigold);}
  .topo-linha{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2;}
  .selo-feira{display:inline-flex;align-items:center;gap:6px;background:rgba(237,231,217,.14);border:1px solid rgba(237,231,217,.25);color:var(--paper);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:5px 10px 5px 8px;border-radius:100px;margin-bottom:14px;}
  .selo-feira .ponto{width:6px;height:6px;border-radius:50%;background:var(--marigold);}
  .nome-feira{font-family:'Fraunces',serif;font-weight:600;font-size:24px;color:var(--paper);line-height:1.05;}
  .sub-feira{color:rgba(237,231,217,.65);font-size:13px;margin-top:6px;}
  .avatar-banca{width:44px;height:44px;border-radius:14px;background:var(--marigold);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:17px;color:var(--ink);flex-shrink:0;}
  .btn-sair{background:none;border:none;color:rgba(237,231,217,.7);font-size:12px;font-weight:600;cursor:pointer;padding:0;margin-top:10px;}

  .corpo{max-width:520px;margin:0 auto;padding:20px 20px 60px;}
  .rotulo-secao{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--sage);margin-bottom:10px;}

  .card-pedido{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(34,53,38,.04);}
  .card-pedido-topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;}
  .cliente-nome{font-family:'Fraunces',serif;font-weight:600;font-size:17px;}
  .status-pago{display:inline-flex;align-items:center;gap:5px;background:rgba(59,91,63,.1);color:var(--leaf);font-size:11px;font-weight:700;letter-spacing:.04em;padding:4px 9px;border-radius:100px;white-space:nowrap;}
  .status-pago::before{content:'✓';}
  .status-aguardando{display:inline-flex;align-items:center;background:var(--error-soft);color:var(--error);font-size:11px;font-weight:700;letter-spacing:.04em;padding:4px 9px;border-radius:100px;white-space:nowrap;}
  .btn-confirmar-pix{width:100%;background:var(--ink);color:var(--paper);border:none;border-radius:100px;padding:13px;font-family:'Inter',sans-serif;font-weight:700;font-size:13.5px;margin-top:16px;cursor:pointer;}
  .btn-confirmar-pix:active{transform:scale(.98);}

  .lista-itens{list-style:none;margin:0 0 14px;padding:0;}
  .lista-itens li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed rgba(34,53,38,.1);font-size:14px;}
  .lista-itens li:last-child{border-bottom:none;}
  .lista-itens .qtd{color:var(--sage);font-family:'Space Mono',monospace;font-size:12px;margin-right:8px;}

  .ticket{background:var(--ink);border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:relative;}
  .ticket-label{color:rgba(237,231,217,.6);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;}
  .ticket-codigo{font-family:'Space Mono',monospace;font-weight:700;font-size:26px;color:var(--marigold);letter-spacing:.12em;}

  .btn-confirmar{width:100%;background:var(--marigold);color:var(--ink);border:none;border-radius:100px;padding:15px;font-family:'Inter',sans-serif;font-weight:700;font-size:14.5px;margin-top:16px;cursor:pointer;box-shadow:0 8px 20px -6px rgba(217,166,46,.5);}
  .btn-confirmar:active{transform:scale(.98);}

  .card-colapsado{background:rgba(255,253,248,.6);border:1px dashed rgba(34,53,38,.15);border-radius:18px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;color:var(--sage);font-size:13px;margin-bottom:10px;}
  .card-colapsado .cliente-nome{font-size:15px;color:rgba(34,53,38,.5);}

  .vazio{text-align:center;color:var(--sage);font-size:13.5px;padding:30px 0;}
  .msg-erro{background:var(--error-soft);color:var(--error);border-radius:10px;padding:11px 13px;font-size:13px;margin-bottom:14px;}
</style>
</head>
<body>

<div id="loginGate">
  <div class="login-card">
    <div class="marca">
      <svg class="marca-icone" viewBox="0 0 24 24" fill="none">
        <path d="M4 8 C4 5, 6 4, 9 4 L15 4 C18 4, 20 6, 20 9 C20 12, 18 13.5, 15 13.5 L8 13.5" stroke="#D9A62E" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <path d="M11 10.5 L8 13.5 L11 16.5" stroke="#D9A62E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M9 19 L11.5 21.5 L16.5 15.5" stroke="#223526" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <div class="marca-texto">Giro<span>Certo</span></div>
    </div>
    <h2>Painel do feirante</h2>
    <p>Confirme os pagamentos e separe os pedidos da sua banca.</p>
    <div class="login-msg" id="loginMsg"></div>
    <input type="email" id="loginEmail" placeholder="E-mail">
    <input type="password" id="loginSenha" placeholder="Senha">
    <button onclick="login()">Entrar</button>
  </div>
</div>

<div id="app">
  <div class="topo">
    <div class="marca">
      <svg class="marca-icone" viewBox="0 0 24 24" fill="none">
        <path d="M4 8 C4 5, 6 4, 9 4 L15 4 C18 4, 20 6, 20 9 C20 12, 18 13.5, 15 13.5 L8 13.5" stroke="#D9A62E" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <path d="M11 10.5 L8 13.5 L11 16.5" stroke="#D9A62E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M9 19 L11.5 21.5 L16.5 15.5" stroke="#223526" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <div class="marca-texto">Giro<span>Certo</span></div>
    </div>
    <div class="topo-linha">
      <div>
        <div class="selo-feira"><span class="ponto"></span><span id="t_feiraNome">—</span></div>
        <div class="nome-feira" id="t_bancaNome">—</div>
        <div class="sub-feira" id="t_resumo">—</div>
      </div>
      <div class="avatar-banca" id="t_avatar">—</div>
    </div>
    <button class="btn-sair" onclick="sair()">Sair</button>
  </div>

  <div class="corpo">
    <div id="msgErro" class="msg-erro" style="display:none;"></div>

    <div class="rotulo-secao">Confirmar recebimento — Pix</div>
    <div id="boxConfirmar"></div>

    <div class="rotulo-secao" style="margin-top:22px;">Na fila (pagamento pendente)</div>
    <div id="boxFila"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://ntmxkwzhumiqspxijuln.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_2f1de7VdoaxdWnGHHZenGQ_3ROsSDSi';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let estabelecimentoId = null;

async function login(){
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginSenha').value;
  const msg = document.getElementById('loginMsg');
  msg.textContent = '';
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error){ msg.textContent = 'E-mail ou senha incorretos.'; return; }
  iniciarApp();
}

async function sair(){
  await supabaseClient.auth.signOut();
  location.reload();
}

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function formatarReal(v){ return 'R$ ' + Number(v).toFixed(2).replace('.', ','); }

async function iniciarApp(){
  const { data: { user } } = await supabaseClient.auth.getUser();
  if(!user) return;

  const { data: estabelecimento, error } = await supabaseClient
    .from('estabelecimentos')
    .select('id, nome, tipo_negocio')
    .eq('auth_user_id', user.id)
    .eq('tipo_negocio', 'feirante')
    .single();

  if(error || !estabelecimento){
    document.getElementById('loginMsg').textContent = 'Essa conta não está cadastrada como feirante.';
    return;
  }

  estabelecimentoId = estabelecimento.id;
  document.getElementById('loginGate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('t_bancaNome').textContent = estabelecimento.nome;
  document.getElementById('t_avatar').textContent = estabelecimento.nome.split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase();

  // achado ao vivo (25/08/2026): "feira" mostrada no cabeçalho vem da
  // participação mais recente do feirante (feirante_participacao ->
  // feira_ocorrencia -> feira) — um feirante pode participar de mais de
  // uma feira/ocorrência, aqui só mostra a mais recente cadastrada como
  // contexto visual (não filtra os pedidos por ela).
  const { data: participacao } = await supabaseClient
    .from('feirante_participacao')
    .select('feira_ocorrencia:feira_ocorrencia_id(feira:feira_id(nome))')
    .eq('estabelecimento_id', estabelecimentoId)
    .order('created_at', { ascending: false })
    .limit(1)
    .maybeSingle();
  document.getElementById('t_feiraNome').textContent = participacao?.feira_ocorrencia?.feira?.nome || 'Sem feira vinculada';

  await carregarPedidos();

  // Realtime — mesmo padrão de app-entregador.html: reage na hora quando
  // um novo pedido chega ou o status_pagamento muda (cliente pagou),
  // sem precisar a feirante ficar atualizando a página manualmente.
  supabaseClient
    .channel('pedidos-feirante')
    .on('postgres_changes', {
      event: '*', schema: 'public', table: 'pedido',
      filter: `estabelecimento_id=eq.${estabelecimentoId}`,
    }, () => carregarPedidos())
    .subscribe();

  // item 72 (02/09/2026, auditoria de gaps de Realtime pedida pelo
  // usuário): rede de segurança de polling, mesmo princípio já usado em
  // painel-loja.html — Realtime acima é o caminho normal, isso só garante
  // que a tela nunca fica presa esperando um evento que pode não chegar
  // (assinatura caindo silenciosamente, mesma classe de achado do item 17).
  setInterval(carregarPedidos, 15000);
}

async function carregarPedidos(){
  const msgErro = document.getElementById('msgErro');
  msgErro.style.display = 'none';

  const { data: pedidos, error } = await supabaseClient
    .from('pedido')
    .select('*, pedido_grupo:pedido_grupo_id(consumidor:consumidor_id(nome)), pedido_item(quantidade, preco_unitario, produto:produto_id(nome)), pedido_nota(codigo_curto)')
    .eq('estabelecimento_id', estabelecimentoId)
    .neq('status_coleta', 'coletado')
    .order('created_at', { ascending: true });

  if(error){
    msgErro.textContent = 'Não deu pra carregar os pedidos: ' + error.message;
    msgErro.style.display = 'block';
    return;
  }

  const pagos = (pedidos || []).filter(p => p.status_pagamento === 'confirmado');
  const pendentes = (pedidos || []).filter(p => p.status_pagamento !== 'confirmado');

  document.getElementById('t_resumo').textContent =
    pagos.filter(p => p.status_coleta !== 'finalizado').length + ' pedido(s) aguardando separação';

  const boxConfirmar = document.getElementById('boxConfirmar');
  boxConfirmar.innerHTML = pagos.length
    ? pagos.map(renderCardPago).join('')
    : '<p class="vazio">Nenhum pedido pago aguardando separação.</p>';

  const boxFila = document.getElementById('boxFila');
  boxFila.innerHTML = pendentes.length
    ? pendentes.map(renderCardPendente).join('')
    : '<p class="vazio">Nenhum pedido na fila.</p>';

  boxConfirmar.querySelectorAll('button[data-pedido-id]').forEach(btn => {
    btn.addEventListener('click', () => marcarComoPronto(btn.dataset.pedidoId));
  });

  boxFila.querySelectorAll('button[data-pedido-id]').forEach(btn => {
    btn.addEventListener('click', () => confirmarPagamento(btn.dataset.pedidoId));
  });
}

function renderCardPago(p){
  const itens = (p.pedido_item || []).map(i => `
    <li><span><span class="qtd">${escapeHtml(String(i.quantidade))}×</span>${escapeHtml(i.produto?.nome || 'Item')}</span><span>${formatarReal(i.quantidade * i.preco_unitario)}</span></li>
  `).join('');

  const nomeCliente = escapeHtml(p.pedido_grupo?.consumidor?.nome || 'Cliente');
  const jaFinalizado = p.status_coleta === 'finalizado';
  // achado ao vivo (25/08/2026): pedido_nota.pedido_id é UNIQUE — o
  // Supabase JS detecta a relação como 1:1 e devolve um OBJETO, não um
  // array (diferente de pedido_item, que é 1:N de verdade).
  const codigo = p.pedido_nota?.codigo_curto;

  return `
    <div class="card-pedido">
      <div class="card-pedido-topo">
        <span class="cliente-nome">${nomeCliente}</span>
        <span class="status-pago">Pix recebido</span>
      </div>
      <ul class="lista-itens">${itens}</ul>
      ${jaFinalizado && codigo ? `
        <div class="ticket">
          <div>
            <div class="ticket-label">Código do pedido</div>
            <div class="ticket-codigo">${escapeHtml(codigo)}</div>
          </div>
          <div style="font-size:28px;">🧺</div>
        </div>
        <p style="font-size:11.5px;color:var(--sage);margin:10px 0 0;text-align:center;">Aguardando o entregador retirar — fale esse código pra confirmar.</p>
      ` : `
        <button class="btn-confirmar" data-pedido-id="${escapeHtml(p.id)}">Marcar como pronto ✓</button>
      `}
    </div>
  `;
}

// item 41 (25/08/2026): achado ao vivo comparando com o componente de
// referência (PainelFeirante em FeiraApp.jsx, ver feira-dispatch.zip) —
// faltava a AÇÃO de confirmar o Pix, não só o card informativo. O
// feirante confirma manualmente que viu o Pix cair na própria conta
// (não existe integração automática com o provedor Pix ainda — mesma
// pendência já documentada, "Integração real de Pix").
function renderCardPendente(p){
  const nomeCliente = escapeHtml(p.pedido_grupo?.consumidor?.nome || 'Cliente');
  const itens = (p.pedido_item || []).map(i => `
    <li><span><span class="qtd">${escapeHtml(String(i.quantidade))}×</span>${escapeHtml(i.produto?.nome || 'Item')}</span><span>${formatarReal(i.quantidade * i.preco_unitario)}</span></li>
  `).join('');
  return `
    <div class="card-pedido" style="opacity:.85;">
      <div class="card-pedido-topo">
        <span class="cliente-nome">${nomeCliente}</span>
        <span class="status-aguardando">Aguardando Pix</span>
      </div>
      <ul class="lista-itens">${itens}</ul>
      <button class="btn-confirmar-pix" data-pedido-id="${escapeHtml(p.id)}">Confirmei o Pix na minha conta</button>
    </div>
  `;
}

// achado ao vivo (25/08/2026): não existe RPC nenhuma pra "finalizar
// separação" — o trigger gerar_nota_pedido() (db/schema.sql) já reage
// sozinho a esse UPDATE (status_coleta vira 'finalizado'), gera o código
// de 4 caracteres em pedido_nota automaticamente. Update direto via RLS
// ("feirante ve e atualiza seus pedidos"), sem RPC nova necessária.
async function marcarComoPronto(pedidoId){
  const { error } = await supabaseClient
    .from('pedido')
    .update({ status_coleta: 'finalizado' })
    .eq('id', pedidoId);
  if(error){
    const msgErro = document.getElementById('msgErro');
    msgErro.textContent = 'Não deu pra marcar como pronto: ' + error.message;
    msgErro.style.display = 'block';
    return;
  }
  await carregarPedidos();
}

async function confirmarPagamento(pedidoId){
  const { error } = await supabaseClient
    .from('pedido')
    .update({ status_pagamento: 'confirmado' })
    .eq('id', pedidoId);
  if(error){
    const msgErro = document.getElementById('msgErro');
    msgErro.textContent = 'Não deu pra confirmar o Pix: ' + error.message;
    msgErro.style.display = 'block';
    return;
  }
  await carregarPedidos();
}

supabaseClient.auth.getSession().then(({ data:{ session } }) => {
  if(session) iniciarApp();
});
</script>
</body>
</html>
